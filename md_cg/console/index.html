<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵枢 · 记忆控制台</title>
<style>
:root{
  /* 亮色：纸本档案——暖纸底、墨色字、墨蓝强调、朱砂印章；发丝线代替投影，小圆角，宋体标题 */
  --bg:#f4f1e8; --panel:#fbf9f3; --line:#dcd5c5; --txt:#24211c; --sub:#5b554a; --faint:#8e8778;
  --accent:#2b4c6f; --accent-soft:#e6e9e6; --ok:#3f7350; --warn:#9a6a16; --bad:#9e3326;
  --shadow:none;
  --radius:4px; --pill:3px; --head:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --seal:#a63d25; --nav-r:0 4px 4px 0; --seal-r:3px; --nav-on:transparent; --nav-bar:var(--accent);
  --ly-knowledge:#2b4c6f; --ly-contextual:#4b7556; --ly-self:#8a4867; --ly-goals:#9a6a16;
  --ly-anchor:#7d6420; --ly-structural:#646a72; --ly-rejected:#9e3326; --ly-unresolved:#8e8778;
}
:root[data-theme="dark"]{
  --bg:#14161b; --panel:#1c1f26; --line:#2b303a; --txt:#e7e9ee; --sub:#a3acbb; --faint:#7c8596;
  --accent:#7b9bff; --accent-soft:#232c45; --ok:#4cc79a; --warn:#e3a54a; --bad:#ef7a7a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --radius:12px; --pill:999px; --head:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif; --seal:linear-gradient(135deg,#3b6ff5,#8a5cf6); --seal-r:8px; --nav-r:9px;
  --nav-on:var(--accent-soft); --nav-bar:transparent;
  --ly-knowledge:#3b6ff5; --ly-contextual:#14a38b; --ly-self:#d0569b; --ly-goals:#d08a12;
  --ly-anchor:#b8860b; --ly-structural:#6b7a90; --ly-rejected:#d14b4b; --ly-unresolved:#8a94a6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --panel:#1c1f26; --line:#2b303a; --txt:#e7e9ee; --sub:#a3acbb; --faint:#7c8596;
    --accent:#7b9bff; --accent-soft:#232c45; --ok:#4cc79a; --warn:#e3a54a; --bad:#ef7a7a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --radius:12px; --pill:999px; --head:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif; --seal:linear-gradient(135deg,#3b6ff5,#8a5cf6); --seal-r:8px; --nav-r:9px;
    --nav-on:var(--accent-soft); --nav-bar:transparent;
    --ly-knowledge:#3b6ff5; --ly-contextual:#14a38b; --ly-self:#d0569b; --ly-goals:#d08a12;
    --ly-anchor:#b8860b; --ly-structural:#6b7a90; --ly-rejected:#d14b4b; --ly-unresolved:#8a94a6;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);
  font:14px/1.65 "Microsoft YaHei UI","Microsoft YaHei","Segoe UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  display:grid;grid-template-columns:220px 1fr;grid-template-rows:60px 1fr;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* 顶栏 */
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;width:184px;font-weight:700;letter-spacing:1px}
.brand .dot{width:26px;height:26px;border-radius:var(--seal-r);background:var(--seal);font-family:var(--head);
  display:grid;place-items:center;color:#fff;font-size:14px}
.search{flex:1;max-width:680px;position:relative}
.search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  color:var(--txt);padding:0 72px 0 38px;font:inherit;transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .ico{position:absolute;left:12px;top:9px;color:var(--faint)}
.search kbd{position:absolute;right:10px;top:8px}
kbd{font:12px/20px Consolas,monospace;padding:0 6px;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:5px;color:var(--sub);background:var(--panel)}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12px}
.ro{padding:3px 10px;border-radius:var(--pill);background:var(--accent-soft);color:var(--accent);font-weight:600}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--sub)}
.iconbtn:hover{background:var(--bg);color:var(--txt)}

/* 侧栏 */
nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--nav-r);color:var(--sub);text-decoration:none}
nav a:hover{background:var(--bg);color:var(--txt)}
nav a.on{background:var(--nav-on);color:var(--accent);font-weight:600;box-shadow:inset 2px 0 0 var(--nav-bar)}
nav .count{margin-left:auto;font-size:12px;color:var(--faint)}
nav a.on .count{color:var(--accent)}
nav .sep{height:1px;background:var(--line);margin:10px 6px}
nav .label{font-size:12px;color:var(--faint);padding:4px 12px}
nav .foot{margin-top:auto;padding:10px 12px 2px;border-top:1px solid var(--line)}
nav .rootpath{font-size:12px;color:var(--faint);word-break:break-all;margin-top:4px}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.status.ok i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.status.bad i{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
.status.bad{color:var(--bad)}
/* 按层分色：卡片左缘色条 + 层徽章同色 */
[data-ly]{--ly:var(--accent)}
[data-ly="knowledge"]{--ly:var(--ly-knowledge)} [data-ly="contextual"]{--ly:var(--ly-contextual)} [data-ly="self"]{--ly:var(--ly-self)}
[data-ly="goals"]{--ly:var(--ly-goals)} [data-ly="anchor"]{--ly:var(--ly-anchor)} [data-ly="structural"]{--ly:var(--ly-structural)}
[data-ly="rejected"]{--ly:var(--ly-rejected)} [data-ly="unresolved"]{--ly:var(--ly-unresolved)}
.item[data-ly]{border-left:3px solid var(--ly)}
.badge.b-layer[data-ly]{background:color-mix(in srgb,var(--ly) 14%,transparent);color:var(--ly)}
nav a[data-ly]:before{content:"";width:8px;height:8px;border-radius:3px;background:var(--ly);flex:none}
/* 显微镜 */
.ms-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ms-form input{flex:1;min-width:220px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:0 12px;font:inherit}
.ms-form input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.strip{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.strip span{font-size:12px;padding:3px 10px;border-radius:var(--pill);border:1px solid var(--line);background:var(--panel);color:var(--sub)}
.strip b{color:var(--txt);margin-left:4px}
.why{margin-top:8px;font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
.why .no{color:var(--bad)} .why .yes{color:var(--ok)}
/* 关联三圈 */
.ring{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;position:relative}
.ring .rh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ring .rh i{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent)}
.ring.mid .rh i{border-color:color-mix(in srgb,var(--accent) 60%,var(--faint))}
.ring.outer .rh i{border-color:var(--faint);border-style:dashed}
.ring .rule{font-size:12px;color:var(--faint);margin:2px 0 6px}
.ring .ri{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:8px;font-size:13px}
.ring .ri:hover{background:var(--bg)}
.ring .ri small{display:block;color:var(--faint);font-size:12px}

/* 主区 */
main{overflow:auto;padding:24px 28px 60px;position:relative}
h1{font-size:20px;font-weight:700;margin-bottom:4px;font-family:var(--head)}
.box h2,.stat .n,.brand span{font-family:var(--head)}
.lead{color:var(--sub);margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .n{font-size:28px;font-weight:700;letter-spacing:.5px}
.stat .l{color:var(--sub);font-size:13px}
.stat.clickable{cursor:pointer}
.stat.clickable:hover{border-color:var(--accent)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px}
.box h2{font-size:15px;margin-bottom:12px}
.bars .row{display:grid;grid-template-columns:90px 1fr 48px;align-items:center;gap:10px;margin:7px 0;cursor:pointer}
.bars .track{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.bars .fill{height:100%;background:var(--accent);border-radius:99px}
.bars .fill[data-ly]{background:var(--ly)}
.bars .v{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:var(--pill);border:1px solid var(--line);background:var(--panel);color:var(--sub);font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--txt)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;
  transition:border-color .12s,transform .12s;text-align:left;width:100%}
.item:hover{border-color:var(--accent)}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item .top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.item .id{font:12px Consolas,monospace;color:var(--faint)}
.item .snip{color:var(--txt);word-break:break-word}
.item .meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;color:var(--faint);font-size:12px}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.badge{font-size:12px;padding:1px 8px;border-radius:6px;font-weight:600}
.b-layer{background:var(--accent-soft);color:var(--accent)}
.b-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.b-bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.more{margin:16px auto 0;display:block}
.btn{padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.btn:hover{border-color:var(--accent);color:var(--accent)}

.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .day{font-weight:700;color:var(--sub);margin:18px 0 8px -22px;padding-left:22px}
.tl .ev{position:relative;margin:8px 0}
.tl .ev:before{content:"";position:absolute;left:-19px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.tl .ev.chat:before{border-color:var(--faint)}

.empty{text-align:center;color:var(--sub);padding:60px 20px}
.empty .big{font:600 30px/1 var(--head);width:56px;height:56px;margin:0 auto 12px;display:grid;place-items:center;
  border:1.5px solid var(--faint);border-radius:var(--seal-r);color:var(--sub)}
.empty code,.hint code{font:13px Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.err{border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--panel));
  color:var(--txt);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.skel{height:76px;border-radius:var(--radius);background:linear-gradient(90deg,var(--panel),var(--bg),var(--panel));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* 详情抽屉 */
#drawer{position:fixed;top:60px;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .2s ease,box-shadow .2s;display:flex;flex-direction:column;z-index:5}
#drawer.open{transform:none;box-shadow:-8px 0 30px rgba(0,0,0,.10)}
#drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
#drawer .dh .id{font:13px Consolas,monospace;color:var(--sub);word-break:break-all;flex:1}
#drawer .db{overflow:auto;padding:18px;flex:1}
.content{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;font-size:14.5px}
.sec{margin-bottom:16px}
.sec h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:13px}
.kv .k{color:var(--faint)}
.kv .v{word-break:break-word}
.link{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
details summary{cursor:pointer;color:var(--sub);font-size:13px}
details pre{white-space:pre-wrap;word-break:break-all;font:12px/1.5 Consolas,monospace;margin-top:8px;color:var(--sub)}

#help{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:9}
#help.open{display:grid}
#help .card{background:var(--panel);border-radius:14px;padding:22px 26px;min-width:320px;box-shadow:var(--shadow)}
#help .card div{display:flex;justify-content:space-between;gap:30px;margin:8px 0}

@media (max-width:820px){
  body{grid-template-columns:1fr}
  nav{display:none}
  .brand span{display:none}.brand{width:auto}
  main{padding:18px 14px 60px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="dot">灵</div><span>灵枢 · 记忆</span></div>
  <form class="search" id="sform" role="search">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="搜索记忆：比如 “我的编辑器偏好”" autocomplete="off" aria-label="搜索记忆">
    <kbd>/</kbd>
  </form>
  <div class="tools">
    <span class="ro" title="控制台不会修改你的任何记忆">只读</span>
    <button class="iconbtn" id="theme" title="切换深色/浅色" aria-label="切换主题">◐</button>
    <button class="iconbtn" id="helpbtn" title="快捷键" aria-label="快捷键">?</button>
  </div>
</header>
<nav id="nav">
  <a href="#/" data-v="home">◎ 概览</a>
  <div class="sep"></div>
  <div class="label">记忆库</div>
  <a href="#/browse" data-v="browse">☰ 全部记忆 <span class="count" id="c-total"></span></a>
  <div id="layers"></div>
  <div class="sep"></div>
  <div class="label">洞察</div>
  <a href="#/inspect" data-v="inspect">⌖ 记忆显微镜</a>
  <div class="sep"></div>
  <div class="label">动态</div>
  <a href="#/timeline" data-v="timeline">◷ 时间线</a>
  <a href="#/review" data-v="review">✓ 待复核 <span class="count" id="c-review"></span></a>
  <div class="foot">
    <div class="status" id="status" role="status"><i></i><span>正在连接…</span></div>
    <div class="rootpath" id="rootpath"></div>
  </div>
</nav>
<main id="main" tabindex="-1"></main>
<aside id="drawer" aria-label="记忆详情">
  <div class="dh"><span class="id" id="d-id"></span>
    <button class="btn" id="d-copy" title="复制记忆 id" style="padding:4px 10px;font-size:12px">复制 id</button>
    <button class="iconbtn" id="d-close" title="关闭 (Esc)">✕</button></div>
  <div class="db" id="d-body"></div>
</aside>
<div id="help" role="dialog" aria-label="快捷键"><div class="card">
  <h2 style="margin-bottom:10px">快捷键</h2>
  <div><span>搜索</span><kbd>/</kbd></div>
  <div><span>上一条 / 下一条</span><span><kbd>k</kbd> <kbd>j</kbd></span></div>
  <div><span>打开选中</span><kbd>Enter</kbd></div>
  <div><span>关闭详情 / 弹窗</span><kbd>Esc</kbd></div>
  <div><span>概览 / 全部 / 时间线 / 显微镜</span><span><kbd>g</kbd> <kbd>b</kbd> <kbd>t</kbd> <kbd>i</kbd></span></div>
</div></div>
<script>
"use strict";
// 渲染纪律：记忆正文是不可信数据——一律 textContent / createElement，绝不拼接 HTML 字符串。
const LAYER = {anchor:"锚点",structural:"结构",knowledge:"知识",contextual:"情境",self:"自我",
  rejected:"已否定",unresolved:"未决",goals:"目标"};
const LIFE = {active:"活跃",converged:"已收敛",demoted:"已降级",archived:"已归档"};
const VER = {unverified:"未验证",verified:"已验证",doubted:"存疑",rechecking:"复核中",expired:"已过期"};
// 资格四态：与 md_cg.mdcg.STATE_* 同名（ACCEPT/DEFER/REJECT/BLINDSPOT）。
const QUAL = {ACCEPT:"可用",DEFER:"待确认",REJECT:"不适用",BLINDSPOT:"盲区"};
const QUAL_CLS = {ACCEPT:"b-ok",DEFER:"b-warn",REJECT:"b-bad",BLINDSPOT:"b-warn"};
const CLEAR = {public:"公开",internal:"内部",private:"私密",secret:"机密"};
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue;
    n.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c); }
  return n;
}
function fmtTime(t){
  if (t == null || t === "") return "—";
  const d = new Date(Number(t) * 1000); if (isNaN(d)) return String(t);
  return d.toLocaleString("zh-CN",{hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function ago(t){
  if (!t) return ""; const s = Date.now()/1000 - Number(t);
  if (s < 60) return "刚刚"; if (s < 3600) return Math.floor(s/60)+" 分钟前";
  if (s < 86400) return Math.floor(s/3600)+" 小时前"; if (s < 86400*30) return Math.floor(s/86400)+" 天前";
  return fmtTime(t).slice(0,10);
}
function verBadge(v){
  const cls = v==="verified"?"b-ok":(v==="doubted"||v==="expired")?"b-bad":v==="rechecking"?"b-warn":"tag";
  return el("span",{class:"badge "+cls}, VER[v]||v||"未标注");
}
function setStatus(ok, text){
  const s = $("#status"); s.className = "status "+(ok?"ok":"bad"); s.lastChild.textContent = text;
}
async function get(path){
  let r;
  try { r = await fetch(path,{headers:{Accept:"application/json"}}); }
  catch(e){ setStatus(false,"连接断开：控制台窗口可能已关闭");
    return {ok:false,error:"offline",hint:"连不上控制台服务。请确认那个黑色窗口还开着，或重新双击启动。"}; }
  setStatus(true,"已连接 · 只读");
  let j; try { j = await r.json(); } catch(e){ j = {ok:false,error:"bad_json",detail:String(e)}; }
  if (!r.ok && j.ok !== false) j = {ok:false,error:"http_"+r.status};
  return j;
}
function errBox(j){
  return el("div",{class:"err"}, el("b",null,"出错了："), j.hint || j.detail || j.error || "未知错误",
    j.error ? el("div",{style:"color:var(--faint);font-size:12px;margin-top:4px"},"错误码 "+j.error) : null);
}
function skeleton(n){ return el("div",{class:"list"}, Array.from({length:n||4},()=>el("div",{class:"skel"}))); }
function setMain(...kids){ const m = $("#main"); m.replaceChildren(...kids.filter(k=>k!=null&&k!==false)); m.scrollTop = 0; }

// ---- 列表与键盘选择 ----
let selIdx = -1;
function items(){ return [...document.querySelectorAll("#main .item[data-id]")]; }
function select(i){
  const xs = items(); if (!xs.length) return;
  selIdx = Math.max(0, Math.min(xs.length-1, i));
  xs.forEach((x,k)=>x.classList.toggle("sel", k===selIdx));
  xs[selIdx].scrollIntoView({block:"nearest"});
}
function card(c, extra){
  const top = el("div",{class:"top"},
    el("span",{class:"badge b-layer","data-ly":c.layer||null}, LAYER[c.layer]||c.layer||"未分层"),
    c.qualification && c.qualification.state ? el("span",{class:"badge "+(QUAL_CLS[c.qualification.state]||"tag"),
      title:c.qualification.reason||""}, QUAL[c.qualification.state]||c.qualification.state) : null,
    c.verification_state ? verBadge(c.verification_state) : null,
    el("span",{class:"id"}, c.id));
  const meta = el("div",{class:"meta"},
    el("span",{title:fmtTime(c.created_at)}, ago(c.created_at)),
    ...(c.tags||[]).slice(0,6).map(t=>el("span",{class:"tag"},t)));
  return el("button",{class:"item","data-id":c.id,"data-ly":c.layer||null,onclick:()=>openNode(c.id)}, top,
    el("div",{class:"snip"}, c.locked ? "（已加密：控制台默认不解密，只显示元数据）" : c.unreadable ? "（读不到正文：文件缺失或无权解密）" : (c.snippet || "（空）")), meta, extra||null);
}

// ---- 视图 ----
let OV = null;
async function loadOverview(){
  const j = await get("/api/overview"); OV = j;
  if (!j.ok) return j;
  $("#c-total").textContent = j.total;
  $("#c-review").textContent = j.review_pending ?? "";
  $("#rootpath").textContent = j.root;
  const L = $("#layers"); L.replaceChildren();
  Object.entries(j.by_layer).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>
    L.appendChild(el("a",{href:"#/browse/"+encodeURIComponent(k),"data-v":"layer:"+k,"data-ly":k},
      LAYER[k]||k, el("span",{class:"count"},v))));
  return j;
}
async function viewHome(){
  setMain(skeleton(3));
  const j = await loadOverview();
  if (!j.ok) return setMain(errBox(j));
  if (!j.total) return setMain(el("div",{class:"empty"}, el("div",{class:"big"},"空"),
    el("h1",null,"这里还没有记忆"),
    el("p",null,"和接入了灵枢的 Agent 聊几句，它记住的东西就会出现在这里。"),
    el("p",{style:"margin-top:8px"},"记忆库位置：", el("code",null,j.root))));
  const stat = (n,l,href) => el("div",{class:"stat"+(href?" clickable":""),onclick:href?()=>{location.hash=href}:null},
    el("div",{class:"n"}, n ?? "—"), el("div",{class:"l"}, l));
  const bars = (obj, map, hrefOf) => { const max = Math.max(1,...Object.values(obj));
    return el("div",{class:"bars"}, Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
      el("div",{class:"row",onclick:hrefOf?()=>{location.hash=hrefOf(k)}:null},
        el("span",null,map[k]||k), el("div",{class:"track"},el("div",{class:"fill","data-ly":map===LAYER?k:null,style:"width:"+(v/max*100).toFixed(1)+"%"})),
        el("span",{class:"v"},v)))); };
  setMain(
    el("h1",null,"概览"), el("p",{class:"lead"},"你的 Agent 目前记住了这些。点任意数字进入对应列表。"),
    el("div",{class:"grid"},
      stat(j.total,"条记忆","/browse"), stat(j.new_7d,"近 7 天新增","/timeline"),
      stat(j.review_pending,"条待复核","/review"), stat(j.recent_events,"条近期对话事件","/timeline")),
    j.review_error ? errBox({hint:"待复核队列读取失败："+j.review_error}) : null,
    el("div",{class:"box"}, el("h2",null,"按层分布"), bars(j.by_layer, LAYER, k=>"/browse/"+encodeURIComponent(k))),
    el("div",{class:"box"}, el("h2",null,"验证状态"), bars(j.by_verification, VER)),
    el("div",{class:"box"}, el("h2",null,"生命状态"), bars(j.by_lifecycle, LIFE)));
}
async function viewBrowse(layer){
  setMain(skeleton());
  const limit = 50; let offset = 0;
  const head = el("div",null, el("h1",null, layer ? (LAYER[layer]||layer)+"层" : "全部记忆"),
    el("p",{class:"lead",id:"blead"},"按写入时间，最新在前。"));
  const chips = el("div",{class:"toolbar"},
    el("button",{class:"chip"+(layer?"":" on"),onclick:()=>{location.hash="/browse"}},"全部"),
    ...Object.keys((OV&&OV.by_layer)||{}).map(k=>el("button",{class:"chip"+(k===layer?" on":""),
      onclick:()=>{location.hash="/browse/"+encodeURIComponent(k)}}, LAYER[k]||k)));
  const list = el("div",{class:"list"});
  const more = el("button",{class:"btn more",onclick:()=>page()},"加载更多");
  async function page(){
    more.disabled = true; more.textContent = "加载中…";
    const j = await get("/api/browse?limit="+limit+"&offset="+offset+(layer?"&layer="+encodeURIComponent(layer):""));
    if (!j.ok){ list.appendChild(errBox(j)); more.remove(); return; }
    j.items.forEach(c=>list.appendChild(card(c)));
    offset += j.items.length;
    $("#blead").textContent = "共 "+j.total+" 条，按写入时间，最新在前。";
    if (!j.total) list.appendChild(el("div",{class:"empty"},"这一层还是空的。"));
    if (offset >= j.total) more.remove(); else { more.disabled = false; more.textContent = "加载更多（还剩 "+(j.total-offset)+" 条）"; }
  }
  setMain(head, chips, list, more); selIdx = -1;
  await page();
}
async function viewSearch(q){
  $("#q").value = q;
  setMain(el("h1",null,"搜索"), skeleton());
  const j = await get("/api/search?k=50&q="+encodeURIComponent(q));
  if (!j.ok) return setMain(el("h1",null,"搜索"), errBox(j));
  selIdx = -1;
  setMain(el("h1",null,"“"+q+"”"),
    el("p",{class:"lead"}, j.total ? "找到 "+j.total+" 条，按相关度排序。“盲区”表示这条记忆要素不全，引用前请自己判断；想看每条为什么被想起，用记忆显微镜。" : ""),
    j.total ? el("div",{class:"list"}, j.items.map(card))
      : el("div",{class:"empty"}, el("div",{class:"big"},"无"), "没有找到相关记忆。换个说法试试，或者少用几个词。"));
  if (j.total) select(0);
}
async function viewTimeline(){
  setMain(el("h1",null,"时间线"), skeleton());
  const j = await get("/api/timeline?limit=200");
  if (!j.ok) return setMain(el("h1",null,"时间线"), errBox(j));
  const tl = el("div",{class:"tl"}); let day = null;
  for (const r of j.items){
    const d = fmtTime(r.t).slice(0,10);
    if (d !== day){ day = d; tl.appendChild(el("div",{class:"day"}, d)); }
    if (r.kind === "node"){
      tl.appendChild(el("div",{class:"ev"}, card({id:r.id,layer:r.layer,snippet:r.text,tags:r.tags,created_at:r.t})));
    } else {
      tl.appendChild(el("div",{class:"ev chat"}, el("div",{class:"item",style:"cursor:default"},
        el("div",{class:"top"}, el("span",{class:"badge tag"}, r.role==="user"?"你说":r.role==="assistant"?"Agent 说":(r.role||"事件")),
          el("span",{class:"id"}, fmtTime(r.t).slice(11))),
        el("div",{class:"snip"}, r.text||""))));
    }
  }
  selIdx = -1;
  setMain(el("h1",null,"时间线"), el("p",{class:"lead"},"最近写下的记忆和对话事件，最新在前。"),
    j.events_error ? errBox({hint:"对话事件读取失败："+j.events_error}) : null,
    j.items.length ? tl : el("div",{class:"empty"},"还没有任何事件。"));
}
async function viewReview(){
  setMain(el("h1",null,"待复核"), skeleton(2));
  const j = await get("/api/review");
  if (!j.ok) return setMain(el("h1",null,"待复核"), errBox({hint:"读不到待复核队列："+(j.detail||j.error)}));
  setMain(el("h1",null,"待复核"),
    el("p",{class:"lead hint"},"Agent 想记、但还没被确认的内容，最久的在前。首版只能查看；要通过或驳回，请在命令行运行 ",
      el("code",null,"python -m md_cg.review_cli list"),"。"),
    j.total ? el("div",{class:"list"}, j.items.map(x=>el("div",{class:"item",style:"cursor:default"},
      el("div",{class:"top"}, el("span",{class:"badge b-warn"}, x.kind||"提案"),
        x.layer ? el("span",{class:"badge b-layer"}, LAYER[x.layer]||x.layer) : null,
        el("span",{class:"id"}, x.pid||"")),
      el("div",{class:"snip"}, x.summary||"（无摘要）"),
      el("div",{class:"meta"}, el("span",null, ago(x.created_at)), ...(x.tags||[]).map(t=>el("span",{class:"tag"},t))))))
      : el("div",{class:"empty"}, el("div",{class:"big"},"毕"), "没有待复核的内容。"));
}

// ---- 记忆显微镜：每条命中为什么被想起 / 换个身份会不会被挡 ----
async function viewInspect(q, clr){
  clr = CLEAR[clr] ? clr : "internal";
  const input = el("input",{type:"search",placeholder:"输入一句 Agent 可能会问的话，比如“我平时几点跑步”",value:q||"","aria-label":"显微镜查询"});
  const go = c => { const v = input.value.trim(); if (v) location.hash = "/inspect/"+encodeURIComponent(c||clr)+"/"+encodeURIComponent(v); };
  const form = el("form",{class:"ms-form",onsubmit:e=>{e.preventDefault();go();}}, input, el("button",{class:"btn",type:"submit"},"检查"));
  const chips = el("div",{class:"toolbar"}, el("span",{style:"color:var(--sub);font-size:13px"},"模拟身份的密级："),
    ...Object.keys(CLEAR).map(k=>el("button",{class:"chip"+(k===clr?" on":""),type:"button",
      title:"一个非设计者、另开会话的 Agent，最高可读 "+k, onclick:()=>{ if (input.value.trim()) go(k); else location.hash="/inspect/"+k; }}, CLEAR[k])));
  const head = [el("h1",null,"记忆显微镜"),
    el("p",{class:"lead"},"看一句话会让 Agent 想起哪些记忆、每条能不能直接用，以及换成权限更低的 Agent 时哪些会被挡掉。"), form, chips];
  if (!q){ setMain(...head, el("div",{class:"empty"}, el("div",{class:"big"},"问"), "输入一句话开始检查。")); input.focus(); return; }
  setMain(...head, skeleton(3));
  const j = await get("/api/inspect?k=50&clearance="+encodeURIComponent(clr)+"&q="+encodeURIComponent(q));
  if (!j.ok) return setMain(...head, errBox(j));
  const n = j.counts||{};
  const strip = el("div",{class:"strip"},
    el("span",null,"命中",el("b",null,j.total)), el("span",null,"可用",el("b",null,n.ACCEPT||0)),
    el("span",null,"待确认",el("b",null,n.DEFER||0)), el("span",null,"不适用",el("b",null,n.REJECT||0)),
    el("span",null,"盲区",el("b",null,n.BLINDSPOT||0)), el("span",null,CLEAR[clr]+"身份看不到",el("b",null,n.hidden||0)),
    j.meta && j.meta.scanned != null ? el("span",null,"扫描候选",el("b",null,j.meta.scanned)) : null);
  const why = c => el("div",{class:"why"},
    el("div",null,"资格：", (QUAL[(c.qualification||{}).state]||"未判定")+(c.qualification&&c.qualification.reason?" —— "+c.qualification.reason:"")),
    c.sim_visible ? el("div",{class:"yes"},"✓ "+CLEAR[clr]+"身份看得到")
      : el("div",{class:"no"},"✕ "+CLEAR[clr]+"身份看不到："+(c.hidden_reason||"原因未知")));
  selIdx = -1;
  setMain(...head, strip,
    j.total ? el("div",{class:"list"}, j.items.map(c=>card(c, why(c))))
      : el("div",{class:"empty"}, el("div",{class:"big"},"无"), "这句话没有让 Agent 想起任何记忆。"),
    el("p",{class:"lead",style:"margin-top:14px;font-size:12px"}, j.note||""));
  if (j.total) select(0);
}
async function relatedSec(id){
  const box = el("div",{class:"sec"}, el("h3",null,"关联记忆"), el("div",{class:"lead",style:"margin:0"},"加载中…"));
  get("/api/related?id="+encodeURIComponent(id)).then(j=>{
    if (drawerId !== id) return;
    if (!j.ok) return box.replaceChildren(el("h3",null,"关联记忆"), errBox(j));
    const any = j.tiers.some(t=>t.total);
    box.replaceChildren(...[el("h3",null,"关联记忆"), any ? null : el("div",{class:"lead",style:"margin:0"},"没有找到相关的记忆。"),
      ...j.tiers.filter(t=>t.total).map(t=>el("div",{class:"ring "+t.key},
        el("div",{class:"rh"}, el("i"), t.label, el("span",{class:"count",style:"margin-left:auto;color:var(--faint);font-weight:400"}, t.total+" 条")),
        el("div",{class:"rule"}, t.rule),
        ...t.items.map(c=>el("button",{class:"ri",onclick:()=>openNode(c.id)},
          el("span",{class:"badge b-layer","data-ly":c.layer||null,style:"margin-right:6px"}, LAYER[c.layer]||c.layer||"?"),
          c.snippet||c.id, el("small",null,(c.why||[]).join("；")+" · "+c.id))),
        t.truncated ? el("div",{class:"rule"},"只列出前 "+t.items.length+" 条") : null))].filter(Boolean));
  });
  return box;
}

// ---- 详情抽屉 ----
let drawerId = null;
function kv(rows){ return el("div",{class:"kv"}, rows.filter(r=>r[1]!=null&&r[1]!==""&&!(Array.isArray(r[1])&&!r[1].length))
  .flatMap(([k,v])=>[el("div",{class:"k"},k), el("div",{class:"v"}, v instanceof Node ? v : String(v))])); }
function nodeLinks(arr, key){
  const xs = (arr||[]).map(x => typeof x === "string" ? x : (x && (x[key]||x.target||x.to||x.id||x.from)) || JSON.stringify(x));
  if (!xs.length) return null;
  return el("div",null, xs.map(id=>el("div",null, el("span",{class:"link",onclick:()=>openNode(id)}, id))));
}
async function openNode(id){
  drawerId = id; $("#d-id").textContent = id; $("#drawer").classList.add("open");
  const b = $("#d-body"); b.replaceChildren(skeleton(2));
  const j = await get("/api/node?id="+encodeURIComponent(id));
  if (drawerId !== id) return;
  if (!j.ok) return b.replaceChildren(errBox(j));
  const a = j.audit || {}, p = a.present || {}, s = a.sources || {}, alt = a.alternatives || {}, bl = a.blindspots || {}, h = a.history || {};
  const validity = Array.isArray(p.validity) ? p.validity[0] : p.validity;
  b.replaceChildren(...[
    j.locked ? el("div",{class:"content"}, "这条是加密记忆，控制台没有解密（"+(j.locked_reason==="console_no_decrypt"?"默认不解密":"解不开："+(j.locked_reason||"未知"))+"）。出处、标签等元数据照常显示；需要看正文时，用 --decrypt-as 指定写入它的身份重新打开控制台。")
             : el("div",{class:"content"}, j.content || "（空）"),
    el("div",{class:"sec"}, el("h3",null,"现值"), kv([
      ["层", LAYER[p.layer]||p.layer], ["验证", verBadge(p.verification_state)], ["生命状态", LIFE[p.lifecycle_state]||p.lifecycle_state],
      ["时效", {valid:"有效",expired:"已过期",pending:"未生效",unknown:"未知"}[validity]||validity],
      ["重要度", p.importance], ["密级", p.sensitivity], ["写入时间", fmtTime(p.created_at)],
      ["标签", (p.tags||[]).join("、")], ["写入方", p.writer], ["来自", p.harness], ["会话", p.session]])),
    el("div",{class:"sec"}, el("h3",null,"出处链"), kv([
      ["派生自", nodeLinks(Array.isArray(s.derived_from)?s.derived_from:(s.derived_from?[s.derived_from]:[]))],
      ["它引用", nodeLinks(s.refers_to && s.refers_to.items, "to")],
      ["被引用", nodeLinks(s.referenced_by && s.referenced_by.items, "from")]]),
      !(s.derived_from||((s.refers_to||{}).total)||((s.referenced_by||{}).total)) ? el("div",{class:"lead",style:"margin:0"},"没有记录到来源或引用关系。") : null),
    await relatedSec(id),
    el("div",{class:"sec"}, el("h3",null,"两存 / 备择"),
      alt.conflicts_total ? el("div",null, el("p",null,"与 "+alt.conflicts_total+" 条记忆在同一条件下说法不同："),
        nodeLinks((alt.conflicts||[]).map(c=>c.id||c.node_id||c))) :
      el("div",{class:"lead",style:"margin:0"}, alt.verdict ? "没有发现冲突（比对了 "+(alt.scanned??0)+" 条）。" : (alt.error || "未比对。"))),
    el("div",{class:"sec"}, el("h3",null,"盲区"), kv([
      ["支持证据", bl.positive_evidence], ["反对证据", bl.negative_evidence],
      ["不适用条件", (bl.non_applicable_conditions||[]).join("；")]])),
    el("div",{class:"sec"}, el("h3",null,"变迁史"),
      ((h.totals||{}).state_history||(h.totals||{}).verification_history||(h.evolution||[]).length)
        ? el("div",null, [...(h.state_history||[]),...(h.verification_history||[])].map(x=>el("div",{class:"tag",style:"margin:3px 0;display:block"},
            JSON.stringify(x))))
        : el("div",{class:"lead",style:"margin:0"},"这条记忆还没有变过。")),
    el("details",null, el("summary",null,"原始数据（frontmatter）"), el("pre",null, JSON.stringify(j.frontmatter,null,2))),
    a.ok === false ? errBox({hint:"审计面组装失败："+a.error}) : null].filter(Boolean));
}
function closeDrawer(){ $("#drawer").classList.remove("open"); drawerId = null; }

// ---- 路由 ----
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/,"")) || "/";
  const [, v, arg] = h.split("/");
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",
    a.dataset.v === (v==="browse"&&arg ? "layer:"+arg : (v||"home"))));
  if (v === "search" && arg) return viewSearch(h.slice("/search/".length));
  if (v === "browse") return viewBrowse(arg || null);
  if (v === "node" && arg){ viewBrowse(null); return openNode(h.slice("/node/".length)); }
  if (v === "inspect"){ const rest = h.split("/").slice(2); return viewInspect(rest.slice(1).join("/"), rest[0]); }
  if (v === "timeline") return viewTimeline();
  if (v === "review") return viewReview();
  return viewHome();
}
window.addEventListener("hashchange", route);
$("#sform").addEventListener("submit", e=>{ e.preventDefault(); const q = $("#q").value.trim();
  if (q) location.hash = "/search/"+encodeURIComponent(q); $("#q").blur(); });
$("#d-close").addEventListener("click", closeDrawer);
$("#d-copy").addEventListener("click", ()=>{ if (!drawerId || !navigator.clipboard) return;
  navigator.clipboard.writeText(drawerId).then(()=>{ const b=$("#d-copy"); b.textContent="已复制"; setTimeout(()=>{b.textContent="复制 id"},1200); }); });
$("#helpbtn").addEventListener("click", ()=>$("#help").classList.add("open"));
$("#help").addEventListener("click", ()=>$("#help").classList.remove("open"));
(function theme(){
  const saved = localStorage.getItem("lingshu-theme"); if (saved) document.documentElement.dataset.theme = saved;
  $("#theme").addEventListener("click", ()=>{
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next; localStorage.setItem("lingshu-theme", next);
  });
})();
document.addEventListener("keydown", e=>{
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "Escape"){ if ($("#help").classList.contains("open")) $("#help").classList.remove("open");
    else if (drawerId) closeDrawer(); else if (typing) document.activeElement.blur(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/"){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if (e.key === "j" || e.key === "k"){ select(selIdx + (e.key === "j" ? 1 : -1));
    const it = items()[selIdx]; if (drawerId && it) openNode(it.dataset.id); }
  else if (e.key === "Enter" && selIdx >= 0 && items()[selIdx]){ items()[selIdx].click(); }
  else if (e.key === "?"){ $("#help").classList.add("open"); }
  else if (e.key === "g"){ location.hash = "/"; } else if (e.key === "b"){ location.hash = "/browse"; }
  else if (e.key === "t"){ location.hash = "/timeline"; } else if (e.key === "i"){ location.hash = "/inspect"; }
});
loadOverview().then(route);
// 状态灯：每 20 秒确认一次服务还在（页面在后台时不打扰）。
setInterval(()=>{ if (document.visibilityState === "visible") get("/api/overview").then(j=>{ if (j.ok){
  $("#c-total").textContent = j.total; $("#c-review").textContent = j.review_pending ?? ""; } }); }, 20000);
</script>
